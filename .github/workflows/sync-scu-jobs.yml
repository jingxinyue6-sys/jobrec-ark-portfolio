name: Deploy synchronized SCU jobs

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: jobrec-pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Synchronize public SCU jobs
        if: github.event_name != 'push'
        run: npm run sync:scu
      - name: Save synchronized feed
        if: github.event_name != 'push'
        run: |
          if git diff --quiet -- public/scu-jobs.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/scu-jobs.json
          git commit -m "chore: sync SCU public jobs"
          git push
      - run: npm run build:pages
      - name: Publish GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./pages-dist
          publish_branch: gh-pages
          force_orphan: true
